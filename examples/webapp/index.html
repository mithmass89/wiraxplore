<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WiraXplore Demo App</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #141a2e;
    --panel-2: #1b2340;
    --line: #2a3352;
    --text: #e8ecf8;
    --muted: #98a2c0;
    --accent: #ff6b35;
    --ok: #35c48b;
    --danger: #ff5c7a;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 15% -10%, #1d2a55 0%, transparent 60%),
      radial-gradient(700px 400px at 110% 10%, #3a1f2b 0%, transparent 55%),
      var(--bg);
    display: grid;
    place-items: center;
    padding: 32px 20px;
  }
  .shell { width: min(940px, 100%); }
  .card {
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
    padding: 28px;
  }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .logo {
    width: 38px; height: 38px; border-radius: 11px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), #ff9f6b);
    color: #1a1207; font-weight: 800; font-size: 18px;
  }
  h1 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .badge {
    margin-left: auto; font-size: 12px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px;
    background: rgba(255, 255, 255, .03);
  }
  .badge[data-state="in"] { color: var(--ok); border-color: rgba(53, 196, 139, .4); }

  label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  .field { margin-bottom: 15px; }
  input, select, textarea {
    width: 100%; padding: 11px 13px; font: inherit; color: var(--text);
    background: #0d1226; border: 1px solid var(--line); border-radius: 10px;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255, 107, 53, .16);
  }
  textarea { resize: vertical; min-height: 74px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 10px;
    border: 1px solid transparent; padding: 11px 18px; transition: filter .15s, transform .05s;
  }
  button:active { transform: translateY(1px); }
  .primary { background: var(--accent); color: #1a1207; }
  .primary:hover { filter: brightness(1.08); }
  .ghost { background: transparent; color: var(--muted); border-color: var(--line); }
  .ghost:hover { color: var(--text); border-color: #3c4770; }
  .actions { display: flex; gap: 10px; align-items: center; margin-top: 4px; }

  .msg { font-size: 13px; margin: 12px 0 0; min-height: 20px; }
  .msg[data-kind="error"] { color: var(--danger); }
  .msg[data-kind="ok"] { color: var(--ok); }

  table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  tbody tr:hover { background: rgba(255, 255, 255, .025); }
  .empty { color: var(--muted); font-size: 14px; padding: 18px 2px; }

  .hidden { display: none !important; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 24px; }
  @media (max-width: 820px) { .split, .row { grid-template-columns: 1fr; } }
  .panel-title { margin: 0 0 12px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  code { background: rgba(255,255,255,.06); padding: 1px 5px; border-radius: 5px; font-size: 12px; }
</style>
</head>
<body>
<div class="shell">
  <div class="card">
    <header>
      <div class="logo">W</div>
      <div>
        <h1>WiraXplore Demo App</h1>
        <p class="sub">Single-file app: login, then add records</p>
      </div>
      <span class="badge" id="session-badge" data-testid="session-badge" data-state="out">belum login</span>
    </header>

    <section id="login-view" data-testid="login-view">
      <form id="login-form" data-testid="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username"
                 placeholder="admin@demo.test" data-testid="login-email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password"
                 placeholder="panda123" data-testid="login-password" />
        </div>
        <div class="actions">
          <button class="primary" type="submit" data-testid="login-submit">Masuk</button>
          <button class="ghost" type="button" id="fill-demo" data-testid="fill-demo">Isi kredensial demo</button>
        </div>
        <p class="msg" id="login-msg" data-testid="login-message"></p>
        <p class="hint">Kredensial demo: <code>admin@demo.test</code> / <code>panda123</code></p>
      </form>
    </section>

    <section id="app-view" class="hidden" data-testid="app-view">
      <div class="split">
        <div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
            <h2 class="panel-title" style="margin:0">Tambah data</h2>
            <button class="ghost" type="button" id="logout" data-testid="logout">Keluar</button>
          </div>
          <form id="data-form" data-testid="data-form" novalidate>
            <div class="field">
              <label for="fullName">Nama lengkap</label>
              <input id="fullName" name="fullName" placeholder="Budi Santoso" data-testid="data-name" />
            </div>
            <div class="row">
              <div class="field">
                <label for="role">Peran</label>
                <select id="role" name="role" data-testid="data-role">
                  <option value="engineer">Engineer</option>
                  <option value="designer">Designer</option>
                  <option value="qa">QA</option>
                  <option value="pm">Product</option>
                </select>
              </div>
              <div class="field">
                <label for="city">Kota</label>
                <input id="city" name="city" placeholder="Jakarta" data-testid="data-city" />
              </div>
            </div>
            <div class="field">
              <label for="notes">Catatan</label>
              <textarea id="notes" name="notes" placeholder="Opsional" data-testid="data-notes"></textarea>
            </div>
            <div class="actions">
              <button class="primary" type="submit" data-testid="data-submit">Simpan</button>
              <button class="ghost" type="reset" data-testid="data-reset">Reset</button>
            </div>
            <p class="msg" id="data-msg" data-testid="data-message"></p>
          </form>
        </div>

        <div>
          <h2 class="panel-title">Data tersimpan (<span id="record-count" data-testid="record-count">0</span>)</h2>
          <div id="empty-state" class="empty" data-testid="empty-state">Belum ada data.</div>
          <table data-testid="record-table" class="hidden">
            <thead>
              <tr><th>Nama</th><th>Peran</th><th>Kota</th></tr>
            </thead>
            <tbody id="record-body" data-testid="record-body"></tbody>
          </table>
          <p class="hint">Data disimpan di <code>localStorage</code> agar bertahan antar reload.</p>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
(function () {
  'use strict';

  var USERS = [{ email: 'admin@demo.test', password: 'panda123', name: 'Admin' }];
  var STORE_KEY = 'wiraxplore.demo.records';
  var SESSION_KEY = 'wiraxplore.demo.session';

  var el = {
    loginView: document.getElementById('login-view'),
    appView: document.getElementById('app-view'),
    loginForm: document.getElementById('login-form'),
    loginMsg: document.getElementById('login-msg'),
    email: document.getElementById('email'),
    password: document.getElementById('password'),
    fillDemo: document.getElementById('fill-demo'),
    logout: document.getElementById('logout'),
    badge: document.getElementById('session-badge'),
    dataForm: document.getElementById('data-form'),
    dataMsg: document.getElementById('data-msg'),
    name: document.getElementById('fullName'),
    role: document.getElementById('role'),
    city: document.getElementById('city'),
    notes: document.getElementById('notes'),
    body: document.getElementById('record-body'),
    table: document.querySelector('[data-testid="record-table"]'),
    empty: document.getElementById('empty-state'),
    count: document.getElementById('record-count')
  };

  function readRecords() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function writeRecords(records) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(records)); } catch (e) {}
  }

  function message(node, kind, text) {
    node.setAttribute('data-kind', kind || '');
    node.textContent = text || '';
  }

  function render() {
    var records = readRecords();
    el.count.textContent = String(records.length);
    el.body.textContent = '';

    records.forEach(function (record) {
      var tr = document.createElement('tr');
      tr.setAttribute('data-testid', 'record-row');
      ['name', 'role', 'city'].forEach(function (key) {
        var td = document.createElement('td');
        td.setAttribute('data-testid', 'record-' + key);
        td.textContent = record[key];
        tr.appendChild(td);
      });
      el.body.appendChild(tr);
    });

    var hasRows = records.length > 0;
    el.table.classList.toggle('hidden', !hasRows);
    el.empty.classList.toggle('hidden', hasRows);
  }

  function setSession(user) {
    var loggedIn = Boolean(user);
    el.loginView.classList.toggle('hidden', loggedIn);
    el.appView.classList.toggle('hidden', !loggedIn);
    el.badge.setAttribute('data-state', loggedIn ? 'in' : 'out');
    el.badge.setAttribute('data-testid', 'session-badge');
    el.badge.textContent = loggedIn ? 'login sebagai ' + user.email : 'belum login';
    try {
      if (loggedIn) localStorage.setItem(SESSION_KEY, JSON.stringify({ email: user.email }));
      else localStorage.removeItem(SESSION_KEY);
    } catch (e) {}
  }

  function currentSession() {
    try {
      return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    } catch (e) {
      return null;
    }
  }

  el.fillDemo.addEventListener('click', function () {
    el.email.value = USERS[0].email;
    el.password.value = USERS[0].password;
    message(el.loginMsg, '', '');
  });

  el.loginForm.addEventListener('submit', function (event) {
    event.preventDefault();
    var email = el.email.value.trim().toLowerCase();
    var password = el.password.value;

    if (!email || !password) {
      message(el.loginMsg, 'error', 'Email dan password wajib diisi.');
      return;
    }

    var match = USERS.filter(function (user) {
      return user.email.toLowerCase() === email && user.password === password;
    })[0];

    if (!match) {
      message(el.loginMsg, 'error', 'Kredensial salah.');
      return;
    }

    message(el.loginMsg, 'ok', '');
    setSession(match);
    render();
  });

  el.logout.addEventListener('click', function () {
    setSession(null);
    el.email.value = '';
    el.password.value = '';
    message(el.loginMsg, '', '');
    message(el.dataMsg, '', '');
  });

  el.dataForm.addEventListener('submit', function (event) {
    event.preventDefault();
    var name = el.name.value.trim();
    var city = el.city.value.trim();

    if (!name) { message(el.dataMsg, 'error', 'Nama wajib diisi.'); return; }
    if (!city) { message(el.dataMsg, 'error', 'Kota wajib diisi.'); return; }

    var records = readRecords();
    records.push({ name: name, role: el.role.value, city: city, notes: el.notes.value.trim() });
    writeRecords(records);

    el.dataForm.reset();
    message(el.dataMsg, 'ok', 'Data "' + name + '" tersimpan.');
    render();
  });

  el.dataForm.addEventListener('reset', function () {
    message(el.dataMsg, '', '');
  });

  var session = currentSession();
  setSession(session ? { email: session.email } : null);
  render();
})();
</script>
</body>
</html>
